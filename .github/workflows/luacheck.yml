name: Luacheck

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  luacheck:
    runs-on: ubuntu-latest

    steps:
      - name: Clone project
        uses: actions/checkout@v4

      - name: Install and run Luacheck
        uses: nebularg/actions-luacheck@v1
        with:
          files: 'PhenomRaidTools/Source'
          args: "--no-color -q"
          annotate: warning
