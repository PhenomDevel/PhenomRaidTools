name: Release

# Packages the addon and uploads it to CurseForge, Wago and GitHub releases
# whenever a tag is pushed. Alpha tags are skipped.
on:
  push:
    tags:
      - "*"
      - "!**-alpha**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # changelog.sh and the packager need the tag history.
          fetch-depth: 0

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luarocks
          sudo luarocks install luacheck

      - name: Lint
        run: luacheck PhenomRaidTools/Source

      - name: Generate changelog
        run: ./changelog.sh

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Send status to Discord
        if: failure()
        uses: nebularg/actions-discord-webhook@v1
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: ${{ job.status }}
